{% extends 'resenas/base.html' %}
{% block titulo %}Crear cuenta{% endblock %}
{% block contenido %}
    <h1>Crear cuenta</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Crear cuenta</button>
    </form>
    <p class="meta">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>.</p>
{% endblock %}
